<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Lodestar">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1f2b"/>
      <stop offset="1" stop-color="#0f1115"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cc4ff"/>
      <stop offset="1" stop-color="#5b9cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b9cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5b9cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#tile)" stroke="#262b36" stroke-width="2"/>
  <circle cx="64" cy="64" r="40" fill="url(#glow)"/>
  <!-- orbit: the monitoring loop, open like a radar sweep -->
  <path d="M64 24 A40 40 0 1 1 24 64" fill="none" stroke="#3ccf7a" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
  <circle cx="24" cy="64" r="4" fill="#3ccf7a"/>
  <!-- four-point lodestar -->
  <path d="M64 30 L71 57 L98 64 L71 71 L64 98 L57 71 L30 64 L57 57 Z" fill="url(#star)"/>
  <path d="M64 44 L68 60 L84 64 L68 68 L64 84 L60 68 L44 64 L60 60 Z" fill="#0f1115" opacity="0.35"/>
  <circle cx="64" cy="64" r="5" fill="#e6e8ee"/>
</svg>
