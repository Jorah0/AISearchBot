name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -e . pyflakes
      - run: python scripts/verify.py  # the one verify command: lint, secret scan, JS syntax, extension + unit tests
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .[e2e]
      - run: python -m playwright install --with-deps chromium
      - run: |  # a run where every test skipped itself (no browser) is a failure, not a green build
          python -m unittest discover -s tests/e2e -p "e2e_*.py" -v 2>&1 | tee e2e.log
          python -c "import sys; sys.path.insert(0, 'scripts'); import verify; w = verify.nothing_ran(open('e2e.log', encoding='utf-8').read()); print(w or 'browser tests ran'); sys.exit(1 if w else 0)"
        shell: bash
        env: { LODESTAR_E2E_BROWSER: chromium }
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: e2e-artifacts, path: tests/e2e/_artifacts, if-no-files-found: ignore }
