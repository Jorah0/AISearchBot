name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e . pyflakes
      - run: python -m pyflakes lodestar tests
      - run: python -W ignore::ResourceWarning -m unittest discover -s tests -v
      - run: node --check lodestar/static/app.js
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .[e2e]
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests/e2e -p "e2e_*.py" -v
        env: { LODESTAR_E2E_BROWSER: chromium }
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: e2e-artifacts, path: tests/e2e/_artifacts, if-no-files-found: ignore }
