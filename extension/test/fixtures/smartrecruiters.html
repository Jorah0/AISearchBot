<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Apply: Reliability Engineer - Driftwood Energy</title></head><body>
<!-- Fictional SmartRecruiters-style form: web components with open shadow roots (declarative), hand-built for tests. -->
<oc-personal-information>
<h3>Personal information</h3>
<spl-input><template shadowrootmode="open"><label for="first-name">First name</label><input id="first-name" type="text"></template></spl-input>
<spl-input><template shadowrootmode="open"><label for="last-name">Last name</label><input id="last-name" type="text"></template></spl-input>
<spl-input><template shadowrootmode="open"><label for="email">Email</label><input id="email" type="email"></template></spl-input>
<spl-input><template shadowrootmode="open"><label for="confirm-email">Confirm your email</label><input id="confirm-email" type="email"></template></spl-input>
<spl-input><template shadowrootmode="open"><label for="phone-number">Phone number</label><input id="phone-number" type="tel"></template></spl-input>
<spl-input><template shadowrootmode="open"><label for="linkedin">LinkedIn profile</label><input id="linkedin" type="url"></template></spl-input>
</oc-personal-information>
<button type="submit">Submit</button>
</body></html>
