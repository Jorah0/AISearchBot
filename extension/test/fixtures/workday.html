<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Apply - Fernhill Freight Careers</title></head><body>
<!-- Fictional Workday-style wizard steps (My Information + My Experience), hand-built for tests: no real company, person or page. -->
<div data-automation-id="applyFlowPage">
<h2 data-automation-id="pageHeader">My Information</h2>
<div data-automation-id="formField-legalNameSection_firstName"><label for="name--legalName--firstName">Given Name(s)*</label><input id="name--legalName--firstName" data-automation-id="legalNameSection_firstName" type="text"></div>
<div data-automation-id="formField-legalNameSection_lastName"><label for="name--legalName--lastName">Family Name*</label><input id="name--legalName--lastName" data-automation-id="legalNameSection_lastName" type="text"></div>
<div data-automation-id="formField-countryDropdown"><label id="country-label">Country*</label><button type="button" aria-haspopup="listbox" aria-labelledby="country-label" data-automation-id="countryDropdown">Select One</button></div>
<div data-automation-id="formField-addressSection_city"><label for="address--city">City*</label><input id="address--city" data-automation-id="addressSection_city" type="text"></div>
<div data-automation-id="formField-email"><label for="emailAddress--emailAddress">Email Address*</label><input id="emailAddress--emailAddress" data-automation-id="email" type="text"></div>
<div data-automation-id="formField-phone-number"><label for="phoneNumber--phoneNumber">Phone Number*</label><input id="phoneNumber--phoneNumber" data-automation-id="phone-number" type="text"></div>
<h2 data-automation-id="pageHeader">My Experience</h2>
<div data-automation-id="workExperienceSection">
<h4>Work Experience 1</h4>
<div><label for="workExperience-1--jobTitle">Job Title*</label><input id="workExperience-1--jobTitle" data-automation-id="jobTitle" type="text"></div>
<div><label for="workExperience-1--companyName">Company*</label><input id="workExperience-1--companyName" data-automation-id="company" type="text"></div>
<div><label for="workExperience-1--location">Location</label><input id="workExperience-1--location" data-automation-id="location" type="text"></div>
<div><input id="workExperience-1--currentlyWorkHere" type="checkbox"><label for="workExperience-1--currentlyWorkHere">I currently work here</label></div>
<div><input id="workExperience-1--startDate-dateSectionMonth-input" data-automation-id="dateSectionMonth-input" aria-label="Month" placeholder="MM" type="text"><input id="workExperience-1--startDate-dateSectionYear-input" data-automation-id="dateSectionYear-input" aria-label="Year" placeholder="YYYY" type="text"></div>
<div><label for="workExperience-1--roleDescription">Role Description</label><textarea id="workExperience-1--roleDescription" data-automation-id="description"></textarea></div>
<h4>Work Experience 2</h4>
<div><label for="workExperience-2--jobTitle">Job Title*</label><input id="workExperience-2--jobTitle" data-automation-id="jobTitle" type="text"></div>
<div><label for="workExperience-2--companyName">Company*</label><input id="workExperience-2--companyName" data-automation-id="company" type="text"></div>
<div><input id="workExperience-2--startDate-dateSectionYear-input" data-automation-id="dateSectionYear-input" aria-label="Year" placeholder="YYYY" type="text"></div>
<div><input id="workExperience-2--endDate-dateSectionYear-input" data-automation-id="dateSectionYear-input" aria-label="Year" placeholder="YYYY" type="text"></div>
<button type="button" data-automation-id="Add Another">Add Another</button>
</div>
<div data-automation-id="educationSection">
<h4>Education 1</h4>
<div><label for="education-1--school">School or University*</label><input id="education-1--school" data-automation-id="school" type="text"></div>
<div><label id="education-1--degree-label">Degree*</label><button type="button" aria-haspopup="listbox" aria-labelledby="education-1--degree-label" id="education-1--degree" data-automation-id="degree">Select One</button></div>
</div>
<button type="button" data-automation-id="bottom-navigation-next-button">Save and Continue</button>
</div>
</body></html>
