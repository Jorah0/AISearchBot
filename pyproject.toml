[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lodestar"
version = "0.2.0"
description = "Lodestar: AI job-search workbot. Resume tailoring, cover letters, email + website monitoring, approvals inbox, idea crafting, resume tailoring, cover letters, email + website monitoring, credential vault, application tracker, multi-AI council"
requires-python = ">=3.11"
dependencies = ["keyring>=24", "python-docx>=1.1"]

[project.optional-dependencies]
desktop = ["pywebview>=5"]
pdf = ["pypdf>=4"]
all = ["pywebview>=5", "pypdf>=4", "playwright>=1.50"]
apply = ["playwright>=1.50"]  # the apply agent (apply_agent.py): drives your installed Edge / Chrome; no 'playwright install'
e2e = ["playwright>=1.48", "coverage>=7"]  # browser tests: tests/e2e (uses installed Edge; CI installs chromium)

[project.scripts]
lodestar = "lodestar.cli:main"
jobbot = "lodestar.cli:main"  # legacy alias

[project.gui-scripts]
lodestarw = "lodestar.cli:main_hidden"  # no console window: the desktop shortcut and the scheduled task

[tool.setuptools.packages.find]
include = ["lodestar*"]

[tool.setuptools.package-data]
lodestar = ["static/*", "data/*"]

[tool.coverage.run]  # docs/TESTS.md > Coverage: unit + E2E suites, combined
source = ["lodestar"]

[tool.coverage.report]
skip_empty = true
