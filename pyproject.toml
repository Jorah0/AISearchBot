[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lodestar"
version = "0.2.0"
description = "Lodestar: AI job-search workbot. Resume tailoring, cover letters, email + website monitoring, approvals inbox, idea crafting, resume tailoring, cover letters, email + website monitoring, credential vault, application tracker, multi-AI council"
requires-python = ">=3.11"
dependencies = ["keyring>=24", "python-docx>=1.1"]

[project.optional-dependencies]
desktop = ["pywebview>=5"]
pdf = ["pypdf>=4"]
all = ["pywebview>=5", "pypdf>=4"]

[project.scripts]
lodestar = "lodestar.cli:main"
jobbot = "lodestar.cli:main"  # legacy alias

[tool.setuptools.packages.find]
include = ["lodestar*"]

[tool.setuptools.package-data]
lodestar = ["static/*"]
